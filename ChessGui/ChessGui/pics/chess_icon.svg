<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background: dark navy rounded square -->
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2d4a7a"/>
      <stop offset="100%" stop-color="#111c35"/>
    </radialGradient>
    <radialGradient id="piece" cx="55%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4c9a8"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Chess knight silhouette, facing right -->
  <path fill="url(#piece)" stroke="#a09070" stroke-width="0.6" stroke-linejoin="round"
    d="
      M 18,85 L 82,85 L 76,75 L 58,75 L 58,68
      C 65,62 71,54 71,45
      C 75,37 73,27 66,19
      C 73,15 79,10 75,5
      C 71,2  63,3  57,7
      C 53,5  47,4  41,7
      C 35,10 31,16 30,23
      C 28,30 30,37 34,41
      C 30,47 28,55 30,63
      C 31,68 34,72 37,75
      L 24,75 Z
    "/>

  <!-- Mane highlight detail -->
  <path fill="none" stroke="#a09070" stroke-width="0.8" stroke-linecap="round"
    d="M 34,41 C 38,38 44,36 48,32 C 50,28 48,22 44,18"/>

  <!-- Eye -->
  <circle cx="66" cy="18" r="2.8" fill="#111c35"/>
  <circle cx="65" cy="17" r="0.9" fill="#ffffff" opacity="0.6"/>

  <!-- Nostril -->
  <circle cx="71" cy="24" r="1.4" fill="#a09070"/>

  <!-- Base shadow line -->
  <rect x="20" y="83" width="60" height="1.5" rx="0.75" fill="#0a1020" opacity="0.4"/>
</svg>
