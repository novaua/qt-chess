name: Build Installer

on:
  pull_request:
    branches: [develop, main]
  push:
    tags: ['v*']

env:
  QT_VERSION: '6.10.2'

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build-installer:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qt5compat qtshadertools qtmultimedia

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Qt VS Tools supplies the MSBuild targets that process moc/rcc and set
      # Qt include/link paths from the <QtModules> property in the .vcxproj.
      # The VSIX is a ZIP; we extract it, locate qt.targets, and hand the
      # directory to MSBuild via /p:QtMsBuild. The Qt installation is
      # registered in the HKCU registry under the version name that matches
      # <QtInstall>6.10.2_msvc2022_64</QtInstall> in ChessGui.vcxproj.
      - name: Install Qt VS Tools MSBuild integration
        id: qtvstools
        shell: pwsh
        run: |
          # VS Marketplace always serves the latest published Qt VS Tools version.
          $vsixUrl = 'https://marketplace.visualstudio.com/_apis/public/gallery/publishers/TheQtCompany/vsextensions/QtVisualStudioTools2022/latest/vspackage'
          Write-Host "Downloading Qt VS Tools from VS Marketplace"
          Invoke-WebRequest $vsixUrl -OutFile qt-vstools.vsix -UseBasicParsing

          Expand-Archive qt-vstools.vsix -DestinationPath qt-vstools -Force
          $targets = Get-ChildItem qt-vstools -Recurse -Filter 'qt.targets' | Select-Object -First 1
          if (-not $targets) { throw "qt.targets not found inside VSIX" }
          $msbuildDir = $targets.DirectoryName
          Write-Host "Qt MSBuild dir: $msbuildDir"
          "msbuild_dir=$msbuildDir" | Out-File $env:GITHUB_OUTPUT -Append

          # Derive the Qt msvc2022_64 root from qmake.exe which install-qt-action
          # puts on PATH: qmake lives in <qtroot>/bin/, one level up is the root.
          $qmake = (Get-Command qmake.exe).Source
          $qtInstallDir = Split-Path -Parent (Split-Path -Parent $qmake)
          Write-Host "Qt install dir: $qtInstallDir  (qmake: $qmake)"
          "qt_install_dir=$qtInstallDir" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Compute version string
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}" -replace '^v', ''
            if ($v -notmatch '^\d+\.\d+\.\d+') {
              throw "Tag '${{ github.ref_name }}' must look like vMAJOR.MINOR.PATCH[-suffix]"
            }
            # Stamped into the exe/dll version resources (see Directory.Build.props)
            "build=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            $v = "pr-${{ github.event.pull_request.number }}"
          }
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build (MSBuild Release|x64)
        shell: pwsh
        run: |
          # PR builds keep the AppVersion default from Directory.Build.props
          # (an empty /p:AppVersion= would override it, so only pass it for tags).
          $versionArgs = @()
          if ("${{ steps.version.outputs.build }}") { $versionArgs += "/p:AppVersion=${{ steps.version.outputs.build }}" }
          msbuild ChessCore.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            $versionArgs `
            /p:PlatformToolset=v143 `
            /p:QtMsBuild="${{ steps.qtvstools.outputs.msbuild_dir }}" `
            /p:QtInstall="${{ steps.qtvstools.outputs.qt_install_dir }}" `
            /m /v:minimal

      - name: Collect deployment files
        shell: pwsh
        run: |
          New-Item -Path deploy -ItemType Directory -Force
          Copy-Item x64\Release\ChessGui.exe       deploy\
          Copy-Item x64\Release\LiChessConnector.dll deploy\
          windeployqt --release --verbose 2 --qmldir ChessGui\ChessGui deploy\ChessGui.exe
          Write-Host "=== deploy folder contents ==="
          Get-ChildItem deploy -Recurse | Select-Object FullName

      - name: Verify version metadata
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.build }}"
          foreach ($f in 'deploy\ChessGui.exe', 'deploy\LiChessConnector.dll') {
            $vi = (Get-Item $f).VersionInfo
            Write-Host "$f : $($vi.ProductName) $($vi.ProductVersion) / $($vi.CompanyName)"
            if ($vi.ProductName -ne 'Chess++' -or [string]::IsNullOrEmpty($vi.CompanyName)) {
              throw "$f is missing product metadata"
            }
            $core = ($expected -split '-')[0]
            if ($expected -and $vi.ProductVersion -ne "$core.0") {
              throw "$f version '$($vi.ProductVersion)' does not match tag version '$core'"
            }
          }

      - name: Decode Certificate
        shell: pwsh
        run: |
          $certBase64 = "${{ secrets.PFX_CERT_BASE64 }}"
          if ([string]::IsNullOrEmpty($certBase64)) {
            Write-Error "PFX_CERT_BASE64 is empty! Check your GitHub Secrets."
            exit 1
          }
          [System.Convert]::FromBase64String($certBase64) | Set-Content "${{ github.workspace }}\certificate.pfx" -AsByteStream
      
      - name : Create Signing Script
        shell: pwsh
        run: |
          $pfxPath = "${{ github.workspace }}\certificate.pfx"
          # Use %PFX_PASS% so the password is resolved by CMD at call time, not stored in the file.
          $signScript = "@signtool.exe sign /v /f `"$pfxPath`" /p %PFX_PASS% /tr http://timestamp.sectigo.com /td sha256 /fd sha256 %1"
          $signScript | Out-File -FilePath "${{ github.workspace }}\sign_tool.bat" -Encoding ascii

      - name: Sign Binaries (EXE only)
        shell: pwsh
        env:
          PFX_PASS: ${{ secrets.PFX_PASSWORD }}
        run: |
          Write-Host "Signing app EXEs in deploy folder..."
          Get-ChildItem -Path deploy -Filter *.exe -Recurse | ForEach-Object { & "${{ github.workspace }}\sign_tool.bat" "$($_.FullName)" }

      - name: Build and Sign Inno Setup installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          PFX_PASS: ${{ secrets.PFX_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub API rate limit for Resolve-Stockfish.ps1
        run: |
          # Pin the newest stable Stockfish (+ previous as fallback) with GitHub's SHA-256.
          $stockfishArgs = @(& installer\Resolve-Stockfish.ps1 -AsIsccArgs)
          $stockfishArgs | ForEach-Object { Write-Host $_ }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /S"MySignTool=${{ github.workspace }}\sign_tool.bat `$f" `
            @stockfishArgs `
            installer\ChessSetup.iss

      - name: Cleanup Certificate
        if: always()
        run: | 
           Remove-Item "${{ github.workspace }}\certificate.pfx" -Force -ErrorAction SilentlyContinue
           Remove-Item "${{ github.workspace }}\sign_tool.bat" -Force -ErrorAction SilentlyContinue

      # PR builds: upload installer as a downloadable artifact (14-day retention)
      - name: Upload installer artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ChessSetup-${{ steps.version.outputs.value }}
          path: installer/Output/ChessSetup-*.exe
          retention-days: 14

      # Tag pushes: use docs/release-notes/<tag>.md if present (auto-generated
      # notes are appended either way)
      - name: Locate release notes
        id: notes
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $f = "docs/release-notes/${{ github.ref_name }}.md"
          if (Test-Path $f) { "path=$f" | Out-File $env:GITHUB_OUTPUT -Append }
          else { Write-Host "No $f - using generated notes only" }

      # Tag pushes: publish a GitHub Release
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: "Chess++ ${{ github.ref_name }}"
          files: installer/Output/ChessSetup-*.exe
          fail_on_unmatched_files: true
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
